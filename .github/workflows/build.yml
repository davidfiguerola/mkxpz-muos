name: Compilar mkxp-z para muOS (ARM64)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar este repositorio
        uses: actions/checkout@v4

      - name: Configurar emulador QEMU ARM64
        uses: docker/setup-qemu-action@v3

      - name: Compilar mkxp-z dentro de contenedor Debian Bookworm ARM64
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/workspace -w /workspace arm64v8/debian:bookworm bash /workspace/build.sh

      - name: Subir binario compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-muos-arm64
          path: dist/
