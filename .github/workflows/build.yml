name: Compilar mkxp-z para muOS (ARM64)

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Clonar este repositorio
        uses: actions/checkout@v4

      - name: Configurar emulador QEMU ARM64
        uses: docker/setup-qemu-action@v3

      - name: Compilar mkxp-z dentro de contenedor Debian Bookworm ARM64
        run: |
          docker run --rm --platform linux/arm64 -v "$PWD":/workspace -w /workspace arm64v8/debian:bookworm bash -c '
            cat << "EOF" > /tmp/compile.sh
            set -ex
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential git cmake ninja-build meson pkg-config xxd file ca-certificates \
              libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
              libgles2-mesa-dev libgl-dev \
              libopenal-dev libphysfs-dev libfluidsynth-dev \
              libtheora-dev libvorbis-dev libpixman-1-dev \
              libuchardet-dev libssl-dev ruby3.1-dev \
              libasound2-dev zlib1g-dev libbz2-dev

            # 1. Compilar SDL2_sound (version compatible con SDL2)
            git clone --depth 1 --branch git https://github.com/mkxp-z/SDL_sound.git /tmp/sdl_sound
            cmake -B /tmp/sdl_sound/build -S /tmp/sdl_sound \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DSDLSOUND_BUILD_STATIC=OFF \
              -DSDLSOUND_BUILD_SHARED=ON
            cmake --build /tmp/sdl_sound/build -j$(nproc)
            cmake --install /tmp/sdl_sound/build
            ldconfig

            # 2. Clonar mkxp-z (rama dev con soporte Essentials v21)
            git clone --depth 1 --branch dev https://github.com/mkxp-z/mkxp-z.git /tmp/mkxp-z
            cd /tmp/mkxp-z

            # 3. En Linux glibc, iconv esta integrado en libc (satisfacer busqueda de meson)
            ar cr /usr/lib/libiconv.a
            ar cr /usr/lib/libcharset.a
            sed -i "s/find_library(\x27iconv\x27)/find_library(\x27iconv\x27, required: false)/g" src/meson.build
            sed -i "s/find_library(\x27charset\x27)/find_library(\x27charset\x27, required: false)/g" src/meson.build

            # 4. Configurar Meson: GLES + SDL2 dinamica + Ruby 3.1
            meson setup build \
              --buildtype=release \
              --default-library=shared \
              -Dgfx_backend=gles \
              -Dmri_version=3.1 \
              -Dshared_fluid=true \
              -Dstatic_executable=false \
              -Dworkdir_current=true \
              -Duse_miniffi=true \
              -Denable-https=true

            ninja -C build

            # 5. Empaquetar resultado
            mkdir -p /workspace/dist/lib
            cp build/mkxp-z /workspace/dist/

            # 6. Copiar librerias compartidas dependientes (excluyendo libc y la SDL2/Mali de muOS)
            ldd build/mkxp-z | grep "=> /" | awk "{print \$3}" | while read -r so; do
              case "$(basename "$so")" in
                libc.so*|libm.so*|libpthread.so*|libdl.so*|librt.so*|ld-linux*) continue ;;
                libSDL2-2.0.so*) continue ;;
                libGL.so*|libEGL.so*|libGLESv2.so*|libmali.so*) continue ;;
                *) cp -L "$so" /workspace/dist/lib/ 2>/dev/null || true ;;
              esac
            done

            cd /workspace/dist/lib
            ln -sf libruby-3.1.so.3.1 libruby.so.3.1 2>/dev/null || true
            ln -sf libruby-3.1.so.3.1 libruby.so 2>/dev/null || true
            EOF
            bash /tmp/compile.sh
          '

      - name: Subir binario compilado como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-muos-arm64
          path: dist/
